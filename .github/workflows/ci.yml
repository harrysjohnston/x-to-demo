name: CI

on:
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (lint + typecheck + unit + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Biome (lint)
        run: pnpm -C apps/web lint
      - name: TypeScript (typecheck)
        run: pnpm -C apps/web typecheck
      - name: Vitest (unit)
        run: pnpm -C apps/web test
      - name: Install Playwright browsers
        run: pnpm -C apps/web exec playwright install --with-deps
      - name: Playwright (e2e)
        run: pnpm -C apps/web e2e

  api:
    name: API (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Ruff (format check)
        run: uv run --project apps/api --extra dev python -m ruff format --check apps/api/app apps/api/tests
      - name: Ruff (lint)
        run: uv run --project apps/api --extra dev python -m ruff check apps/api/app apps/api/tests
      - name: Pytest
        run: uv run --project apps/api --extra dev python -m pytest -q -c apps/api/pyproject.toml apps/api/tests

  pre-commit:
    name: pre-commit (all hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run pre-commit
        run: uv run --project apps/api --extra dev python -m pre_commit run --all-files --show-diff-on-failure
